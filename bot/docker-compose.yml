services:
  bot:
    build:
      # The Rust CLI is built from the workspace, so the context is the repo root.
      context: ..
      dockerfile: bot/Dockerfile
    image: afterword-bot:local
    ports:
      # Loopback only: the job API is unauthenticated (see the "No
      # authentication" note in bot/README.md), so it must not be published on
      # every interface. Put a reverse proxy in front of it, or reach it from
      # the host, before changing this.
      - "127.0.0.1:8787:8787"
    environment:
      BOT_NAME: Afterword Notetaker
      # Required, no default: the consent notice announces this link to every
      # participant, so point it at the policy for *this* deployment.
      PRIVACY_URL: https://github.com/judeotine/Afterword/blob/main/PRIVACY_POLICY.md
      HEADLESS: "true"
      RECORDINGS_DIR: /app/recordings
      MODELS_DIR: /app/models
      TRANSCRIBE_ENGINE: whisper
      TRANSCRIBE_MODEL: base
      MAX_MEETING_MINUTES: "180"
      ALONE_TIMEOUT_SECONDS: "120"
    volumes:
      # The container runs as pwuser (uid 1000); these directories must be
      # writable by that uid on the host.
      - ./recordings:/app/recordings
      - ./models:/app/models
    # Chromium needs more than the default 64 MB of shared memory.
    shm_size: "1gb"
    restart: unless-stopped
