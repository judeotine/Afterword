[package]
name = "afterword-core"
version = "0.4.0"
description = "Afterword core - Tauri-free transcription and audio processing pipeline"
authors = ["Afterword contributors", "Sujith S (Meetily upstream)"]
license = "MIT"
repository = "https://github.com/judeotine/Afterword"
edition = "2021"
rust-version = "1.77"

[lib]
name = "afterword_core"

# Headless CLI used by the meeting-bot service (and handy for local batch runs).
# Only the binary depends on clap/env_logger; the library stays argv-free.
[[bin]]
name = "afterword-transcribe"
path = "src/bin/afterword-transcribe.rs"

[[bin]]
name = "afterword-summarise"
path = "src/bin/afterword-summarise.rs"

# Hardware acceleration features, forwarded to whisper-rs.
# frontend/src-tauri forwards its identically named features here so that
# `pnpm tauri:dev:cuda` and friends keep working.
[features]
default = []
metal = ["whisper-rs/metal"]       # macOS: Apple Metal GPU (auto-enabled on macOS)
coreml = ["whisper-rs/coreml"]     # macOS: Apple CoreML acceleration
cuda = ["whisper-rs/cuda"]         # Windows/Linux: NVIDIA CUDA GPU
vulkan = ["whisper-rs/vulkan"]     # Windows/Linux: AMD/Intel Vulkan GPU
hipblas = ["whisper-rs/hipblas"]   # Linux: AMD ROCm HIP
openblas = ["whisper-rs/openblas"] # Optimized BLAS
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }
chrono = { version = "0.4.31", features = ["serde"] }
log = "0.4"
tracing = "0.1.40"
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.17.1"
thiserror = "2.0.16"
which = "6.0.1"
dirs = "5.0.1"
tempfile = "3.3.0"
bytemuck = "1.16.1"
futures-util = "0.3"

# CLI-only dependencies (used by src/bin/afterword-transcribe.rs)
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# Audio processing
ebur128 = "0.1"
nnnoiseless = "0.5"
realfft = "3.4.0"
rubato = "0.15.0"
rayon = "1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Parakeet (ONNX-based fast transcription)
ort = { version = "2.0.0-rc.10" }
ndarray = "0.16"
regex = "1.11.0"

# macOS: Metal GPU + CoreML acceleration enabled by default
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
whisper-rs = { version = "0.13.2", features = ["raw-api"] }

[dev-dependencies]
tempfile = "3.3.0"
