name: afterword-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afterword}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afterword}
      POSTGRES_DB: ${POSTGRES_DB:-afterword}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-afterword}" -d "${POSTGRES_DB:-afterword}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afterword}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afterword-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afterword}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afterword-dev-secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set afterword http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        for bucket in audio transcripts clips exports; do
          mc mb --ignore-existing "afterword/$${bucket}"
        done
        mc ls afterword

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.dev
        required: false
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-afterword}:${POSTGRES_PASSWORD:-afterword}@postgres:5432/${POSTGRES_DB:-afterword}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-afterword}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-afterword-dev-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
