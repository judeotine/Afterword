name: afterword

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required, set it in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required, set it in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 1m

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVER_URL: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    cpus: 1.0

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKETS: ${S3_BUCKETS:-audio transcripts clips exports}
      API_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required, it is the API's own MinIO key}
      API_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required, it is the API's own MinIO secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set afterword http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        resources=""
        for bucket in $${BUCKETS}; do
          mc mb --ignore-existing "afterword/$${bucket}"
          mc anonymous set none "afterword/$${bucket}"
          resources="$${resources}\"arn:aws:s3:::$${bucket}\",\"arn:aws:s3:::$${bucket}/*\","
        done
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":[%s]}]}' "$${resources%,}" >/tmp/api-policy.json
        if mc admin user svcacct info afterword "$${API_ACCESS_KEY}" >/dev/null 2>&1; then
          mc admin user svcacct edit --secret-key "$${API_SECRET_KEY}" --policy /tmp/api-policy.json afterword "$${API_ACCESS_KEY}"
        else
          mc admin user svcacct add --access-key "$${API_ACCESS_KEY}" --secret-key "$${API_SECRET_KEY}" --policy /tmp/api-policy.json afterword "$${MINIO_ROOT_USER}"
        fi
        mc ls afterword
    mem_limit: 128m
    cpus: 0.25

  api:
    image: ghcr.io/judeotine/afterword-api:${TAG:?TAG is required, set it in deploy/.env}
    restart: unless-stopped
    logging: *logging
    env_file:
      - api.env
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATIONS_DIR: /migrations
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required, it is the API's own MinIO key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required, it is the API's own MinIO secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s

  web:
    image: ghcr.io/judeotine/afterword-web:${TAG:-latest}
    profiles:
      - web
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NEXT_PUBLIC_APP_BASE_URL: ${APP_BASE_URL}
    depends_on:
      api:
        condition: service_started
    mem_limit: 512m
    cpus: 1.0

  transcribe-worker:
    image: ghcr.io/judeotine/afterword-transcribe-worker:${TAG:-latest}
    profiles:
      - workers
    restart: unless-stopped
    logging: *logging
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-whisper}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-base}
      MODELS_DIR: /models
      WORK_DIR: /work
    volumes:
      - transcribe-models:/models
      - transcribe-work:/work
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 1200m
    cpus: 1.5
    stop_grace_period: 2m

  bot-worker:
    image: ghcr.io/judeotine/afterword-bot:${TAG:-latest}
    profiles:
      - workers
    restart: unless-stopped
    logging: *logging
    environment:
      API_BASE_URL: ${API_BASE_URL}
      PRIVACY_URL: ${PRIVACY_URL:?PRIVACY_URL is required, the consent notice announces it to every participant}
      BOT_NAME: ${BOT_NAME:-Afterword Notetaker}
      HEADLESS: "true"
      RECORDINGS_DIR: /app/recordings
      MODELS_DIR: /app/models
      TRANSCRIBE_ENGINE: ${TRANSCRIBE_ENGINE:-whisper}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-base}
      MAX_MEETING_MINUTES: ${MAX_MEETING_MINUTES:-180}
      ALONE_TIMEOUT_SECONDS: ${ALONE_TIMEOUT_SECONDS:-120}
    volumes:
      - bot-models:/app/models
      - bot-recordings:/app/recordings
    depends_on:
      api:
        condition: service_started
    shm_size: 512m
    mem_limit: 1000m
    cpus: 1.5
    stop_grace_period: 2m
    deploy:
      replicas: ${BOT_WORKER_REPLICAS:-1}

  backup:
    image: ghcr.io/judeotine/afterword-backup:${TAG}
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?BACKUP_BUCKET is required}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-afterword}
      BACKUP_MAX_DELETE: ${BACKUP_MAX_DELETE:-100}
      BUCKETS: ${S3_BUCKETS:-audio transcripts clips exports}
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_ENDPOINT:?BACKUP_ENDPOINT is required}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_ACCESS_KEY:?BACKUP_ACCESS_KEY is required}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_SECRET_KEY:?BACKUP_SECRET_KEY is required}
    volumes:
      - backup-staging:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  minio-data:
  transcribe-models:
  transcribe-work:
  bot-models:
  bot-recordings:
  backup-staging:
