name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev cmake libssl-dev pkg-config ffmpeg

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg

      - name: Build llama-helper (macOS, metal)
        if: runner.os == 'macOS'
        run: cargo build -p llama-helper --features metal

      - name: Build llama-helper
        if: runner.os != 'macOS'
        run: cargo build -p llama-helper

      - name: Copy llama-helper sidecar
        shell: bash
        run: |
          set -euo pipefail
          TARGET_TRIPLE=$(rustc -vV | grep "host:" | awk '{print $2}')
          BASE_BINARY="llama-helper"
          SIDECAR_BINARY="llama-helper-$TARGET_TRIPLE"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BASE_BINARY="llama-helper.exe"
            SIDECAR_BINARY="llama-helper-$TARGET_TRIPLE.exe"
          fi
          mkdir -p frontend/src-tauri/binaries
          cp "target/debug/$BASE_BINARY" "frontend/src-tauri/binaries/$SIDECAR_BINARY"

      # Lint on one leg only: the cfg-gated arms of afterword-core differ per
      # platform, and a lint clean on macOS/Windows is not evidence for Linux.
      - name: cargo fmt (afterword-core)
        if: runner.os == 'Linux'
        run: cargo fmt --check -p afterword-core

      - name: cargo clippy (afterword-core)
        if: runner.os == 'Linux'
        run: cargo clippy -p afterword-core --all-targets -- -D warnings

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Build tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run

      - name: Write Common Controls v6 manifest beside app test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@
          $exes = Get-ChildItem target\debug\deps -Filter 'app_lib-*.exe'
          if (-not $exes) { throw 'no app_lib test executable found' }
          foreach ($exe in $exes) {
            Set-Content -Path "$($exe.FullName).manifest" -Value $manifest -Encoding UTF8
            Write-Host "wrote $($exe.Name).manifest"
          }

      - name: cargo test (core crates, Windows)
        if: runner.os == 'Windows'
        run: cargo test -p afterword-core -p llama-helper

      - name: cargo test (desktop app lib, Windows)
        if: runner.os == 'Windows'
        run: cargo test -p afterword --lib

      - name: cargo test
        if: runner.os != 'Windows'
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Test (node)
        working-directory: frontend
        run: pnpm test

      # Two of the three test files under frontend/tests/lib are Bun tests
      # (.ts/.js), which `node --test tests/lib/*.test.mjs` never runs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test (bun)
        working-directory: frontend
        run: pnpm test:bun

      - name: Build
        working-directory: frontend
        run: pnpm build

  bot:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bot/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
